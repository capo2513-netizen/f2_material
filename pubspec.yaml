name: f2_material
description: "F2 Telecom Material Management App"
publish_to: 'none'

version: 1.0.6+19

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  package_info_plus: ^8.0.0
  dio: ^5.4.3+1
  open_filex: ^4.5.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  mobile_scanner: ^6.0.4
  device_info_plus: ^11.3.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  vibration: ^3.1.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/