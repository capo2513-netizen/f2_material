name: f2_material
description: "F2 Telecom Material Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  mobile_scanner: ^6.0.4
  device_info_plus: ^11.3.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  permission_handler: 11.3.1 # ^ 기호 없이 11.3.1 로 정확히 고정
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# 앱 아이콘 자동 생성 설정 (맨 왼쪽 벽에 붙임)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # 앱 내부에서 로고 이미지를 불러올 수 있도록 에셋 경로 등록
  assets:
    - assets/icon/